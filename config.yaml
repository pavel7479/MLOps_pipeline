market_data:
  provider: binance
  symbol: BTCUSDT
  timeframe: 1h
  start_date: "2024-01-01"
  end_date: null

storage:
  raw_dir: data/raw
  processed_dir: data/processed
  format: parquet

http:
  timeout_seconds: 15
  max_retries: 3
  retry_delay_seconds: 2

logging:
  level: INFO

features:
  returns:
    periods: [1, 3, 6, 12, 24]
  rolling_mean:
    windows: [6, 12, 24]
  rolling_std:
    windows: [6, 12, 24]
  volume:
    change_periods: [1, 6]
    rolling_windows: [6, 24]
  rsi:
    period: 14
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  atr:
    period: 14

target:
  horizon_hours: 3
  buy_threshold: 0.003
  sell_threshold: -0.003
  rare_class_warning_threshold: 0.05

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

ml_dataset:
  output_dir: data/ml

models:
  dummy:
    strategy: most_frequent
  logistic_regression:
    max_iter: 2000
    random_state: 42
    class_weight: null
  catboost:
    iterations: 300
    depth: 6
    learning_rate: 0.05
    random_seed: 42
    verbose: false
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    random_state: 42
  lightgbm:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    random_state: 42

evaluation:
  primary_metric: macro_f1
  models_dir: artifacts/models
  results_dir: artifacts/model_evaluation

time_series_validation:
  n_splits: 5

hyperparameter_search:
  n_iter: 20
  random_state: 42
  scoring: macro_f1
  models_dir: artifacts/tuned_models
  results_dir: artifacts/hyperparameter_search

search_spaces:
  catboost:
    iterations: [200, 300, 500, 700]
    depth: [4, 5, 6, 7, 8]
    learning_rate: [0.01, 0.03, 0.05, 0.1]
    l2_leaf_reg: [1, 3, 5, 7, 10]
  xgboost:
    n_estimators: [200, 300, 500, 700]
    max_depth: [3, 4, 5, 6, 8]
    learning_rate: [0.01, 0.03, 0.05, 0.1]
    subsample: [0.7, 0.8, 0.9, 1.0]
    colsample_bytree: [0.7, 0.8, 0.9, 1.0]
    min_child_weight: [1, 3, 5, 7]
  lightgbm:
    n_estimators: [200, 300, 500, 700]
    max_depth: [-1, 4, 6, 8, 10]
    learning_rate: [0.01, 0.03, 0.05, 0.1]
    num_leaves: [15, 31, 63, 127]
    subsample: [0.7, 0.8, 0.9, 1.0]
    colsample_bytree: [0.7, 0.8, 0.9, 1.0]
    min_child_samples: [10, 20, 30, 50]

backtesting:
  initial_cash: 10000.0
  commission_rate: 0.001
  slippage_rate: 0.0
  allow_short: false
  leverage: 1.0
  force_close_at_end: true
  output_dir: artifacts/backtesting
  strategies:
    lightgbm_block3:
      display_name: LightGBM Block 3
      model_version: block_3
      model_path: artifacts/models/lightgbm.joblib
    lightgbm_tuned:
      display_name: Tuned LightGBM
      model_version: block_4_tuned
      model_path: artifacts/tuned_models/lightgbm_tuned.joblib

mlflow:
  tracking_uri: "http://127.0.0.1:5000"
  experiment_name: "crypto_direction_classification"
  registered_model_name: "crypto_direction_classifier"
  artifact_location: null
  enabled: true

api:
  host: "127.0.0.1"
  port: 8000
  title: "Crypto ML Inference API"
  version: "1.0.0"

inference:
  registered_model_name: "crypto_direction_classifier"
  model_alias: "champion"
  expected_symbol: "BTCUSDT"
  expected_timeframe: "1h"

database:
  url_env_variable: "DATABASE_URL"
  pool_pre_ping: true

monitoring:
  reference_path: monitoring/reference/BTCUSDT_1h_train_reference.json
  window_size: 500
  min_samples: 100
  poll_interval_seconds: 60
  metrics_host: "0.0.0.0"
  metrics_port: 9101
  warning_threshold: 0.10
  critical_threshold: 0.25
