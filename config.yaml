market_data:
  provider: binance
  symbol: BTCUSDT
  timeframe: 1h
  start_date: "2024-01-01"
  end_date: null

storage:
  raw_dir: data/raw
  processed_dir: data/processed
  format: parquet

http:
  timeout_seconds: 15
  max_retries: 3
  retry_delay_seconds: 2

logging:
  level: INFO

features:
  returns:
    periods: [1, 3, 6, 12, 24]
  rolling_mean:
    windows: [6, 12, 24]
  rolling_std:
    windows: [6, 12, 24]
  volume:
    change_periods: [1, 6]
    rolling_windows: [6, 24]
  rsi:
    period: 14
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  atr:
    period: 14

target:
  horizon_hours: 3
  buy_threshold: 0.003
  sell_threshold: -0.003
  rare_class_warning_threshold: 0.05

split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

ml_dataset:
  output_dir: data/ml

models:
  dummy:
    strategy: most_frequent
  logistic_regression:
    max_iter: 2000
    random_state: 42
    class_weight: null
  catboost:
    iterations: 300
    depth: 6
    learning_rate: 0.05
    random_seed: 42
    verbose: false
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    random_state: 42
  lightgbm:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    random_state: 42

evaluation:
  primary_metric: macro_f1
  models_dir: artifacts/models
  results_dir: artifacts/model_evaluation
