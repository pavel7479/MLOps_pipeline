name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUNTIME_IMAGE: crypto-ml-api:ci
  TEST_IMAGE: crypto-ml-api-test:ci

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run Python tests
        run: python -m pytest -v

  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whitespace errors
        run: git diff --check
      - name: Compile Python sources
        run: python3 -m compileall -q src scripts tests
      - name: Validate Docker Compose configuration
        run: >-
          docker compose
          --env-file .env.ci.example
          -f compose.yaml
          -f compose.ci.yaml
          config --quiet

  docker-build:
    name: Docker runtime build
    needs: [python-tests, project-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build runtime image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: ${{ env.RUNTIME_IMAGE }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Inspect runtime isolation and user
        shell: bash
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$RUNTIME_IMAGE")"
          test -n "$user"
          test "$user" != "root"
          docker run --rm --entrypoint sh "$RUNTIME_IMAGE" -ec '
            for forbidden in .env .env.docker BTCUSDT_1h_train.parquet BTCUSDT_1h_validation.parquet BTCUSDT_1h_test.parquet .venv; do
              if find /app -name "$forbidden" -print -quit | grep -q .; then
                echo "Forbidden runtime content: $forbidden" >&2
                exit 1
              fi
            done
          '
          docker run --rm --entrypoint python "$RUNTIME_IMAGE" -c "import importlib.util; raise SystemExit(importlib.util.find_spec('pytest') is not None)"

  container-tests:
    name: Linux container tests
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build Linux test image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: test
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: |
            type=gha,scope=test
            type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=test
      - name: Check dependencies inside image
        run: docker run --rm "$TEST_IMAGE" python -m pip check
      - name: Run tests inside Linux image
        run: docker run --rm "$TEST_IMAGE" python -m pytest -v

  compose-integration:
    name: Compose integration
    needs: [container-tests]
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: crypto-ml-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build disposable stack images
        shell: bash
        run: |
          docker buildx build --target runtime --load --tag crypto-ml-api:stage10 --cache-from type=gha,scope=runtime --cache-to type=gha,mode=max,scope=runtime .
          docker buildx build --target test --load --tag crypto-ml-api-test:stage10 --cache-from type=gha,scope=test --cache-to type=gha,mode=max,scope=test .
      - name: Create deterministic CI Registry fixtures
        shell: bash
        run: |
          mkdir -p .ci-runtime
          docker run --rm --user 0 --volume "$PWD/.ci-runtime:/ci-output" --volume "$PWD/tests/fixtures/feature_manifest.json:/ci-input/feature_manifest.json:ro" crypto-ml-api-test:stage10 python scripts/create_ci_bootstrap_artifacts.py --output-root /ci-output --feature-manifest /ci-input/feature_manifest.json
      - name: Start stack, wait for health, and run smoke test
        id: integration
        shell: bash
        run: |
          docker compose --env-file .env.ci.example -f compose.yaml -f compose.ci.yaml up --detach --no-build postgres mlflow migrate mlflow-init api monitoring-worker prometheus grafana
          python scripts/wait_for_compose.py --project-name "$COMPOSE_PROJECT_NAME" --env-file .env.ci.example --timeout 240
          docker compose --env-file .env.ci.example -f compose.yaml -f compose.ci.yaml exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose --env-file .env.ci.example -f compose.yaml -f compose.ci.yaml exec -T prometheus promtool check rules /etc/prometheus/rules.yml
          docker compose --env-file .env.ci.example -f compose.yaml -f compose.ci.yaml --profile test run --rm --no-deps integration-tests
          test "$(docker compose --env-file .env.ci.example -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U ci_user -d ci_db -tAc 'SELECT COUNT(*) >= 7 FROM predictions;')" = "t"
          docker compose --env-file .env.ci.example -f compose.yaml -f compose.ci.yaml exec -T postgres psql -U ci_user -d ci_db -tAc 'SELECT version_num FROM alembic_version;' | grep -Eq '^[0-9a-f_]+$'
      - name: Collect failed stack diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose --env-file .env.ci.example -f compose.yaml -f compose.ci.yaml ps --all || true
          docker compose --env-file .env.ci.example -f compose.yaml -f compose.ci.yaml logs --no-color --tail 250 api monitoring-worker prometheus grafana || true
      - name: Stop disposable stack
        if: always()
        shell: bash
        run: >-
          docker compose
          --env-file .env.ci.example
          -f compose.yaml
          -f compose.ci.yaml
          down --remove-orphans
