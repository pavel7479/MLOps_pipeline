global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: crypto-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: crypto-ml-monitor
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-worker:9101"]
